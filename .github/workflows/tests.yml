name: Tests

# Runs on pushes to main and on pull requests targeting main, including pull requests from forks.
# Uses `pull_request` (never `pull_request_target`): fork code runs with a read-only token and no
# repository secrets. No job needs secrets, LiveKit credentials, or paid inference.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions and images are pinned to immutable commit SHAs / digests (tag in the comment).
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  checks:
    name: Typecheck, lint, format, build, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      # Includes the browser bundle scan (examples/web/scripts/check-bundle.mjs).
      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # Starts the production Next.js server and checks security headers and the initial page.
      - name: Browser production smoke test
        run: pnpm --filter @voicebridge/web-example smoke

      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

  core-isolated:
    name: Core runs without vendor packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Packs @voicebridge/core, installs it with npm in an empty directory outside the workspace,
      # fails if any @livekit/* (or other vendor) package is present, then runs the core test suite.
      - name: Verify core isolation
        run: pnpm run verify:core-isolation

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs the gitleaks CLI from its official container image (no licence key or token needed).
      - name: Scan repository history with gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
