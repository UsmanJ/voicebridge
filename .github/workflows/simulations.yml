# Runs the scenarios in scenarios.yaml against the agent on LiveKit Cloud.
# Simulations spend real (paid) inference and need repository secrets, so this
# workflow is manual-only: trigger it from the Actions tab. It never runs on push
# or on pull requests. Run `lk agent simulate text --scenarios scenarios.yaml`
# locally while iterating.
name: Simulations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install LiveKit CLI
        run: curl -sSL https://get.livekit.io/cli | bash

      - name: Run simulations
        run: lk agent simulate text --scenarios scenarios.yaml
