version: 2
updates:
  # Pinned GitHub Actions SHAs in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # npm dependencies of the pnpm workspace (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      livekit:
        patterns: ['@livekit/*', 'livekit-*']
      dev-tooling:
        dependency-type: development
